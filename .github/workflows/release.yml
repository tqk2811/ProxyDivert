name: Release

# Build the WPF app and publish a GitHub Release. Runs when a tag 'vM.N.P' is pushed:
#   git tag v1.0.3 && git push origin v1.0.3
# Also runnable by hand (workflow_dispatch) to rebuild a release: pick the TAG as the ref, not a branch.
#
# Version (computed in src/ProxyDivert/ProxyDivert.csproj, target SetVersionFromGit) = the tag itself.
#
# /releases model: one GitHub Release per tag. Its notes (git-cliff, cliff-release.toml) list the
# commits since the previous vM.N.P tag. Four zips are uploaded,
# {with, without the local API} x {self-contained, framework-dependent}:
#   ProxyDivert-M.N.K-win-x64.zip          local API + MCP, self-contained (no runtime needed)
#   ProxyDivert-M.N.K-win-x64-fd.zip       local API + MCP, needs .NET 8 Desktop + ASP.NET Core Runtime
#   ProxyDivert-M.N.K-lite-win-x64.zip     no local API (-p:EnableLocalApi=false), self-contained
#   ProxyDivert-M.N.K-lite-win-x64-fd.zip  no local API, needs only the .NET 8 Desktop Runtime
# GitHub does not start this workflow when more than 3 tags are pushed at once: push tags one by one.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One queue per tag: a shared group keeps only one pending run, so a third tag pushed while
  # one builds would cancel the second tag's run.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout (full history + tags + submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # A manual run from a branch, or a tag on a commit that is not on master, is not a release.
      - name: Check tag
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -ne 'tag') { throw "Run this workflow on a tag vM.N.P, not on '${{ github.ref_name }}'" }
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) { throw "Tag '${{ github.ref_name }}' is not on master" }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install git-cliff
        shell: pwsh
        run: |
          $ver = "2.13.1"
          $url = "https://github.com/orhun/git-cliff/releases/download/v$ver/git-cliff-$ver-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP "git-cliff.zip"
          Invoke-WebRequest $url -OutFile $zip
          $dst = Join-Path $env:RUNNER_TEMP "git-cliff"
          Expand-Archive $zip -DestinationPath $dst -Force
          $exe = Get-ChildItem $dst -Recurse -Filter git-cliff.exe | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName

      # Only tests that are deterministic on a hosted runner. Left out:
      # - real ETW kernel session + child process, whole-machine process listing under a time budget
      # - Stopwatch/Task.Delay thresholds (PeekableStream, two held-connection router tests)
      # - tests that open a real 1400x900 WPF window (depend on the runner's desktop size)
      # Debug build: the submodule libraries only run GitVersion in Release.
      - name: Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exclude = @(
            'EtwProcessEventSourceTests'
            'NativeProcessReadingTests'
            'PeekableStreamTests'
            'TcpConnectionRouterTests.AConnectionRoutedThroughATunnelThatIsStillDialling_IsHeldRatherThanSentDirect'
            'TcpConnectionRouterTests.AHeldConnection_GoesThroughAsSoonAsTheTunnelIsUp'
            'DataGridColumnBindingTests'
            'GridColumnLayoutTests'
            'PolicyRenameTests'
            'ProcessRuleDragTests'
            'ConditionDragDropTests'
            'AppliedProcessTreeTests'
            'EditableComboBoxThemeTests'
          )
          $filter = ($exclude | ForEach-Object { "FullyQualifiedName!~ProxyDivert.Core.Tests.$_" }) -join '&'
          dotnet test src/ProxyDivert.Core.Tests -c Debug --filter $filter --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "dotnet test failed" }

          # The WinDivert submodule's own tests (all in-memory, no driver): they guard the NAT
          # rewrite, e.g. the loopback checksum case that once broke every IPv4 connection.
          # Left out: ConcurrentSynsShareSweeps asserts at most 3 sweeps for 50 SYNs, which a slow
          # runner can exceed.
          dotnet test libs/TqkLibrary.WinDivert/src/TqkLibrary.WinDivert.Tests -c Debug `
            --filter "FullyQualifiedName!~NatRedirectHeldSynTests.ConcurrentSynsShareSweeps" `
            --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "WinDivert tests failed" }

      # The submodule libraries run GitVersion.MsBuild in Release (they have a .nuspec), which fails
      # on a detached submodule HEAD. Their own version does not matter here, so turn it off globally;
      # the app's version comes from git, not GitVersion.
      - name: Publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Four variants into publish/<suffix>: {local API on, off} x {self-contained, framework-dependent}.
          # The suffix is also the zip name's tail (see the header). obj/ is shared between the runs,
          # so each publish restores again for its own EnableLocalApi/self-contained combination.
          $variants = @(
            @{ Suffix = 'win-x64';         Api = 'true';  SelfContained = 'true'  }
            @{ Suffix = 'win-x64-fd';      Api = 'true';  SelfContained = 'false' }
            @{ Suffix = 'lite-win-x64';    Api = 'false'; SelfContained = 'true'  }
            @{ Suffix = 'lite-win-x64-fd'; Api = 'false'; SelfContained = 'false' }
          )
          foreach ($v in $variants) {
            dotnet publish src/ProxyDivert/ProxyDivert.csproj -c Release -o "publish/$($v.Suffix)" `
              --self-contained $v.SelfContained "-p:EnableLocalApi=$($v.Api)" `
              -p:DisableGitVersionTask=true -p:WriteVersionInfoToBuildLog=false `
              -p:GenerateGitVersionInformation=false -p:UpdateAssemblyInfo=false -p:GenerateGitVersionFiles=false
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed ($($v.Suffix))" }
            if ($v.Api -eq 'false') {
              $leak = @(Get-ChildItem "publish/$($v.Suffix)" -Filter *.dll |
                Where-Object { $_.Name -match '^(Microsoft\.AspNetCore|Swashbuckle|ModelContextProtocol)' })
              if ($leak.Count -gt 0) { throw "lite build $($v.Suffix) ships $($leak.Name -join ', ')" }
            }
          }

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The SDK may append '+<commit sha>' to the product version; the tag must match the rest.
          $ver = ((Get-Item publish/win-x64/ProxyDivert.exe).VersionInfo.ProductVersion -split '\+')[0]
          $tag = $env:GITHUB_REF_NAME
          if ($ver -notmatch '^\d+\.\d+\.\d+$' -or "v$ver" -ne $tag) { throw "Built version '$ver' does not match tag '$tag'" }
          $zips = foreach ($dir in Get-ChildItem publish -Directory) {
            $zip = "ProxyDivert-$ver-$($dir.Name).zip"
            Compress-Archive -Path "$($dir.FullName)/*" -DestinationPath $zip
            $zip
          }
          Add-Content $env:GITHUB_OUTPUT "version=$ver"
          Add-Content $env:GITHUB_OUTPUT "tag=$tag"
          Add-Content $env:GITHUB_OUTPUT "zips=$($zips -join ';')"
          Write-Host "version=$ver  release-tag=$tag  zips=$($zips -join ', ')"

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.zip.outputs.tag }}
          VERSION: ${{ steps.zip.outputs.version }}
          ZIPS: ${{ steps.zip.outputs.zips }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG

          # Release notes: commits since the previous vM.N.P tag (whole history when this is the first).
          $range = $tag
          $prevTag = git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$tag^" 2>$null
          if ($LASTEXITCODE -eq 0 -and $prevTag) { $range = "$($prevTag.Trim())..$tag" }
          $notes = (@(git-cliff --config cliff-release.toml $range) | Where-Object { $_.Trim() }) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "git-cliff failed" }
          $notes = $notes -replace '__REPO__', "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)"
          if ($prevTag) { $notes = "$notes`n`n**Full changelog**: $($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/compare/$($prevTag.Trim())...$tag" }
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Release $tag" }
          Set-Content -Path RELEASE_NOTES.md -Value $notes -Encoding utf8

          # gh is a native command: a non-zero exit does not throw under 'Stop', so check by hand.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed" }
          } else {
            gh release create $tag --title $tag --notes-file RELEASE_NOTES.md --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
          gh release upload $tag @($env:ZIPS -split ';') --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
