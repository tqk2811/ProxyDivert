# git-cliff config for GitHub Release notes (used by CI .github/workflows/release.yml).
# Used with range "<previous vM.N.P tag>..<this tag>" (merged branches included): one bullet per
# commit, which release.yml puts in the Release body as is.

[changelog]
header = ""
# Only list change types users care about (filtered at the display step).
# To add/remove types: edit the list in `commit.group in [...]` below.
# Each item links to its commit: on the scope, or on (type) when the commit has no scope.
# '__REPO__' is replaced by release.yml with $GITHUB_SERVER_URL/$GITHUB_REPOSITORY.
body = """
{% for commit in commits %}\
{% if commit.group in ["feat", "fix", "perf", "revert", "refactor", "chore"] %}\
- {% if commit.scope %}({{ commit.group }}) [**{{ commit.scope }}**](__REPO__/commit/{{ commit.id }}){% else %}[({{ commit.group }})](__REPO__/commit/{{ commit.id }}){% endif %} {{ commit.message | upper_first }}{% if commit.breaking %} [**breaking**]{% endif %}
{% endif %}\
{% endfor %}\
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    { pattern = '  +', replace = " " },
    { pattern = ' *\[release\]', replace = "" },
]
commit_parsers = [
    { message = "^feat", group = "feat" },
    { message = "^fix", group = "fix" },
    { message = "^perf", group = "perf" },
    { message = "^refactor", group = "refactor" },
    { message = "^docs", group = "docs" },
    { message = "^test", group = "test" },
    { message = "^build", group = "build" },
    { message = "^ci", group = "ci" },
    { message = "^style", group = "style" },
    { message = "^revert", group = "revert" },
    { message = "^sample", group = "sample" },
    { message = "^chore", group = "chore" },
    { message = ".*", group = "other" },
    # Display-type filtering happens in the body template, kept in one place.
]
filter_commits = false
tag_pattern = '[vV]?[0-9]+\.[0-9]+\.[0-9]+'
# Oldest first, the order the changes landed.
sort_commits = "oldest"
